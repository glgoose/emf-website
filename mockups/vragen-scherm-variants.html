<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup - schermweergave vragen</title>
    <style>
      @font-face {
        font-family: "EB Garamond";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("../public/fonts/eb-garamond-normal-latin.woff2") format("woff2");
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "EB Garamond", Georgia, serif;
        background: #e9e7e2;
        color: #111;
        padding: 24px;
      }

      /* ---------- mockup chrome ---------- */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        align-items: center;
        max-width: 1280px;
        margin: 0 auto 16px;
        font-size: 15px;
      }
      .toolbar .group { display: flex; gap: 6px; align-items: center; }
      .toolbar .label {
        font-variant: small-caps;
        letter-spacing: 0.08em;
        color: #666;
        margin-right: 4px;
      }
      .toolbar button {
        font: inherit;
        padding: 4px 12px;
        border: 1px solid #bbb;
        background: #fff;
        cursor: pointer;
      }
      .toolbar button[aria-pressed="true"] { background: #111; color: #fff; border-color: #111; }
      .note { max-width: 1280px; margin: 14px auto 0; font-size: 15px; color: #444; }

      /* ---------- the projected screen ---------- */
      .screen {
        max-width: 1280px;
        margin: 0 auto;
        aspect-ratio: 16 / 9;
        background: #faf9f6;
        box-shadow: 0 0 0 1px #ccc, 0 8px 30px rgba(0, 0, 0, 0.12);
        container-type: size;
        overflow: hidden;
      }
      .frame {
        height: 100%;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
      }
      .main {
        min-height: 0;
        overflow: hidden;
        padding: 4cqw 5cqw 2cqw;
      }

      /* footer strip: identity left, QR right; own row, so it never overlaps */
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 3cqw;
        padding: 1.4cqw 5cqw;
        border-top: 1px solid #ddd;
      }
      .footer .event { display: flex; flex-direction: column; line-height: 1.25; }
      .footer .event .title { font-size: 1.9cqw; font-weight: 500; }
      .footer .event .sub { font-size: 1.6cqw; color: #666; font-style: italic; }
      .footer .ask { display: flex; align-items: center; gap: 1.4cqw; }
      .footer .ask-text { line-height: 1.25; }
      .footer .ask-text .small { font-size: 1.6cqw; color: #444; }
      .footer .ask-text .url { font-size: 1.9cqw; font-weight: 500; }
      .qr { display: block; width: 7cqw; height: 7cqw; }

      .kicker {
        font-variant: small-caps;
        letter-spacing: 0.08em;
        font-size: 1.4cqw;
        color: #666;
        margin-bottom: 1cqw;
      }
      .meta { font-size: 1.4cqw; color: #666; margin-top: 0.5cqw; }
      /* section title, not a status: sentence case, no small caps */
      .kicker.title-k { font-variant: normal; letter-spacing: 0; font-style: italic; }

      .clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }

      /* current question(s) */
      .current { display: flex; flex-direction: column; gap: 2cqw; }
      .current .q {
        border-left: 0.5cqw solid #111;
        padding-left: 2cqw;
      }
      .current .text {
        font-size: var(--cur-size, 3.4cqw);
        line-height: 1.18;
        font-weight: 500;
        -webkit-line-clamp: 6;
      }

      /* queue */
      .queue { list-style: none; }
      .queue li { padding: 1cqw 0; border-top: 1px solid #e3e3e3; }
      .queue li:first-child { border-top: 0; }
      .queue .text { font-size: var(--queue-size, 1.9cqw); line-height: 1.25; -webkit-line-clamp: 2; }
      .queue .meta { font-size: 1.2cqw; }
      .more { font-size: 1.3cqw; color: #666; margin-top: 0.6cqw; }

      /* A: current on top, queue below in two columns */
      .a { display: flex; flex-direction: column; gap: 2.4cqw; height: 100%; }
      .a .queue-wrap { min-height: 0; flex: 1; display: flex; flex-direction: column; }
      .a .queue { display: grid; grid-template-columns: 1fr 1fr; column-gap: 4cqw; align-content: start; min-height: 0; flex: 1; overflow: hidden; }
      .a .queue li:nth-child(2) { border-top: 0; }

      /* B: two columns */
      .b { display: grid; grid-template-columns: 3fr 2fr; gap: 4cqw; height: 100%; }
      .b .left, .b .right { min-height: 0; display: flex; flex-direction: column; }
      .b .right { border-left: 1px solid #ddd; padding-left: 4cqw; }
      .b .queue { min-height: 0; flex: 1; overflow: hidden; }
      .b .queue .text { -webkit-line-clamp: 3; }

      /* C: one list, current highlighted in place */
      .c { height: 100%; display: flex; flex-direction: column; }
      .c .queue { min-height: 0; flex: 1; overflow: hidden; }
      .c .queue li { padding: 1.1cqw 1.6cqw; border-top: 1px solid #e3e3e3; }
      .c .queue .text { font-size: 2.3cqw; }
      .c .queue .meta { font-size: 1.3cqw; }
      .c .queue li.is-current {
        background: #ecebe7;
        border-left: 0.5cqw solid #111;
        border-top-color: transparent;
      }
      .c .queue li.is-current .text { font-weight: 600; }
      .c .queue li.is-current + li { border-top-color: transparent; }

      /* invite / empty states */
      .invite { height: 100%; display: flex; flex-direction: column; justify-content: center; }
      .invite .big { font-size: 3.8cqw; line-height: 1.15; font-weight: 500; }
      .invite .sub { font-size: 1.9cqw; color: #555; margin-top: 1.4cqw; }
      .empty { height: 100%; display: flex; align-items: center; justify-content: center; gap: 5cqw; }
      .empty .qr { width: 16cqw; height: 16cqw; }
      .empty .big { font-size: 4cqw; line-height: 1.15; font-weight: 500; }
      .empty .sub { font-size: 2.2cqw; color: #555; margin-top: 1.2cqw; }
    </style>
  </head>

        { id: 1, text: "Hoe kijken jullie naar pinkwashing door bedrijven tijdens Pride? Is een regenboog op een bankfiliaal winst of verlies?", name: "Sofie", for: "allen" },
        { id: 2, text: "Is dit niet hetzelfde als rainbow capitalism? Kan Pride nog zonder sponsors?", name: "", for: "Peter Drucker" },
        { id: 3, text: "Wat is het verschil tussen liberale LGBTQ+-emancipatie en een antikapitalistische queerpolitiek?", name: "", for: "Peter Drucker" },
        { id: 4, text: "Hoe zag de samenwerking met de vakbonden eruit in de tijd van De Rooie Vlinder?", name: "Jan", for: "Guido Totté" },
        { id: 5, text: "Welke rol speelt kunst vandaag nog in queer verzet, nu festivals steeds meer subsidies verliezen?", name: "", for: "Marcia Poelman" },
        { id: 6, text: "Hoe verbinden we queer strijd met de strijd van mensen zonder papieren?", name: "Amal", for: "allen" },
        { id: 7, text: "Kan de vakbeweging een plek zijn voor queer arbeiders, of blijft dat een mannenbastion?", name: "", for: "allen" },
        { id: 8, text: "Welk boek raden jullie aan om mee te beginnen?", name: "", for: "allen" },
      ];
      const STATES = { one: [1], two: [1, 2], none: [], empty: null };
      const NOTES = {
        a: "A · huidige vraag groot bovenaan, wachtrij kleiner eronder in twee kolommen. Wat niet past, wordt samengevat als \"+ N andere vragen\".",
        b: "B · huidige vraag links, wachtrij altijd zichtbaar rechts. Zonder uitgelichte vraag toont de linkerkant een uitnodiging.",
        c: "C · één lijst, nieuwste eerst; de huidige vraag krijgt een lijn en een achtergrond op haar plek in de lijst.",
      };

      const qrTpl = document.getElementById("qr-tpl");
      const main = document.getElementById("main");
      let variant = "b", state = "one";

      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const meta = (q) =>
        `<div class="meta">${q.name ? esc(q.name) : "anoniem"}${q.for ? ` · voor ${esc(q.for)}` : ""}</div>`;
      const curHtml = (qs) =>
        `<div class="current">${qs.map((q) => `<div class="q"><div class="text clamp">${esc(q.text)}</div>${meta(q)}</div>`).join("")}</div>`;
      const listHtml = (qs, curIds = []) =>
        `<ul class="queue">${qs
          .map((q) => `<li class="${curIds.includes(q.id) ? "is-current" : ""}"><div class="text clamp">${esc(q.text)}</div>${meta(q)}</li>`)
          .join("")}</ul><div class="more" hidden></div>`;

      // Oldest on top, so the newest drop off the end first until the list fits; show "+ N andere vragen".
      function fitQueue(root) {
        root.querySelectorAll(".queue").forEach((ul) => {
          const more = ul.nextElementSibling;
          const total = ul.children.length;
          more.hidden = false; // reserve its line up front, so the check below is honest
          const fits = () => ul.scrollHeight <= ul.clientHeight + 1;
          // Drop the oldest non-current question until the list fits; current ones always stay.
          while (!fits()) {
            const drop = [...ul.children].reverse().find((li) => !li.classList.contains("is-current"));
            if (!drop) break;
            drop.remove();
          }
          const hidden = total - ul.children.length;
          more.hidden = hidden === 0;
          more.textContent = `+ ${hidden} andere ${hidden === 1 ? "vraag" : "vragen"}`;
        });
      }

      function render() {
        const curIds = STATES[state];
        const oldestFirst = [...Q].sort((a, b) => a.id - b.id);
        let html;

        if (curIds === null) {
          html = `<div class="empty"><div><div class="big">Nog geen vragen.</div><div class="sub">Scan de code rechtsonder en stel de eerste.</div></div></div>`;
        } else {
          const cur = Q.filter((q) => curIds.includes(q.id));
          const rest = oldestFirst.filter((q) => !curIds.includes(q.id));
          if (variant === "a") {
            html = `<div class="a">${cur.length ? `<div><div class="kicker">nu</div>${curHtml(cur)}</div>` : ""}
              <div class="queue-wrap">${cur.length ? `<div class="kicker">volgende</div>` : `<div class="kicker title-k">Vragen uit de zaal</div>`}${listHtml(rest)}</div></div>`;
          } else if (variant === "b") {
            const left = cur.length
              ? `<div class="kicker">nu</div>${curHtml(cur)}`
              : `<div class="invite"><div class="big">Vragen uit de zaal</div><div class="sub">Stel je vraag liever niet hardop? Stuur ze online, bijvoorbeeld via je smartphone.</div></div>`;
            html = `<div class="b"><div class="left">${left}</div><div class="right"><div class="kicker">${cur.length ? "volgende" : "binnengekomen"}</div>${listHtml(rest)}</div></div>`;
          } else {
            html = `<div class="c"><div class="kicker title-k">Vragen uit de zaal</div>${listHtml(oldestFirst, curIds)}</div>`;
          }
        }
        main.innerHTML = html;

        // A with several current questions: smaller text so the queue keeps room.
        const n = curIds ? curIds.length : 0;
        main.style.setProperty("--cur-size", n > 1 ? (variant === "b" ? "2.7cqw" : "2.6cqw") : variant === "b" ? "3.4cqw" : "3.4cqw");
        fitQueue(main);

        document.getElementById("note").textContent = NOTES[variant];
        document.querySelectorAll("[data-v]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === variant));
        document.querySelectorAll("[data-s]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.s === state));
      }

      document.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => { variant = b.dataset.v; render(); }));
      document.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => { state = b.dataset.s; render(); }));
      document.addEventListener("keydown", (e) => {
        const vs = ["a", "b", "c"];
        if (e.key === "ArrowRight") variant = vs[(vs.indexOf(variant) + 1) % 3];
        else if (e.key === "ArrowLeft") variant = vs[(vs.indexOf(variant) + 2) % 3];
        else return;
        render();
      });
      const p = new URLSearchParams(location.search);
      variant = p.get("v") || variant;
      state = p.get("s") || state;
      document.fonts.ready.then(render);
      window.addEventListener("resize", render);
      render();
    </script>
  </body>
</html>
